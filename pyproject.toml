[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-editor"
version = "0.1.0"
description = "Node-graph IDE for composing Bluesky experiment plans"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "bluesky>=1.13",
    "ophyd>=1.9",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "black", "ruff"]

[project.scripts]
plan-editor = "plan_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
